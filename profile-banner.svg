<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      @keyframes arrowShoot {
        0% {
          transform: translate(0, 0);
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          transform: translate(400px, -300px);
          opacity: 0;
        }
      }
      
      @keyframes bowDraw {
        0%, 30% { transform: scaleX(1); }
        50% { transform: scaleX(0.6); }
        70%, 100% { transform: scaleX(1); }
      }
      
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(147, 112, 219, 0.5)); }
        50% { filter: drop-shadow(0 0 15px rgba(147, 112, 219, 0.8)); }
      }
      
      .star {
        animation: starTwinkle 3s ease-in-out infinite;
      }
      
      .star-1 { animation-delay: 0s; }
      .star-2 { animation-delay: 0.5s; }
      .star-3 { animation-delay: 1s; }
      .star-4 { animation-delay: 1.5s; }
      .star-5 { animation-delay: 2s; }
      .star-6 { animation-delay: 2.5s; }
      .star-7 { animation-delay: 0.7s; }
      .star-8 { animation-delay: 1.2s; }
      .star-9 { animation-delay: 1.8s; }
      .star-10 { animation-delay: 2.3s; }
      
      .arrow {
        animation: arrowShoot 2s ease-in-out infinite;
        transform-origin: left center;
      }
      
      .bow {
        animation: bowDraw 2s ease-in-out infinite;
        transform-origin: center;
      }
      
      .constellation-line {
        stroke: rgba(147, 112, 219, 0.4);
        stroke-width: 1;
        fill: none;
      }
      
      .sagittarius-glow {
        animation: glow 3s ease-in-out infinite;
      }
    </style>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Constellation Lines -->
  <g class="constellation-line">
    <!-- Sagittarius constellation lines -->
    <line x1="650" y1="80" x2="680" y2="120"/>
    <line x1="680" y1="120" x2="700" y2="140"/>
    <line x1="700" y1="140" x2="720" y2="130"/>
    <line x1="720" y1="130" x2="740" y2="160"/>
    <line x1="650" y1="80" x2="620" y2="110"/>
    <line x1="620" y1="110" x2="600" y2="130"/>
    <line x1="600" y1="130" x2="640" y2="180"/>
    <line x1="640" y1="180" x2="680" y2="200"/>
    <line x1="680" y1="200" x2="720" y2="190"/>
  </g>
  
  <!-- Stars of Sagittarius -->
  <circle cx="650" cy="80" r="3" class="star star-1" fill="#9370DB"/>
  <circle cx="680" cy="120" r="2.5" class="star star-2" fill="#9370DB"/>
  <circle cx="700" cy="140" r="2.8" class="star star-3" fill="#9370DB"/>
  <circle cx="720" cy="130" r="2.6" class="star star-4" fill="#9370DB"/>
  <circle cx="740" cy="160" r="2.5" class="star star-5" fill="#9370DB"/>
  <circle cx="620" cy="110" r="2.7" class="star star-6" fill="#9370DB"/>
  <circle cx="600" cy="130" r="2.5" class="star star-7" fill="#9370DB"/>
  <circle cx="640" cy="180" r="2.6" class="star star-8" fill="#9370DB"/>
  <circle cx="680" cy="200" r="2.8" class="star star-9" fill="#9370DB"/>
  <circle cx="720" cy="190" r="2.5" class="star star-10" fill="#9370DB"/>
  
  <!-- Bow -->
  <g class="bow sagittarius-glow">
    <ellipse cx="550" cy="180" rx="8" ry="30" fill="none" stroke="#9370DB" stroke-width="2"/>
    <line x1="550" y1="150" x2="550" y2="210" stroke="#9370DB" stroke-width="1.5"/>
  </g>
  
  <!-- Arrow -->
  <g class="arrow sagittarius-glow">
    <line x1="560" y1="180" x2="610" y2="130" stroke="#9370DB" stroke-width="2"/>
    <polygon points="610,130 605,125 612,120" fill="#9370DB"/>
    <line x1="560" y1="180" x2="558" y2="175" stroke="#B19CD9" stroke-width="1"/>
  </g>
  
  <!-- Background stars -->
  <circle cx="100" cy="50" r="1.5" fill="#9370DB" opacity="0.4"/>
  <circle cx="200" cy="80" r="1" fill="#9370DB" opacity="0.3"/>
  <circle cx="300" cy="40" r="1.2" fill="#9370DB" opacity="0.4"/>
  <circle cx="1100" cy="60" r="1.5" fill="#9370DB" opacity="0.4"/>
  <circle cx="1050" cy="150" r="1" fill="#9370DB" opacity="0.3"/>
  <circle cx="150" cy="350" r="1.2" fill="#9370DB" opacity="0.4"/>
  <circle cx="1000" cy="350" r="1.5" fill="#9370DB" opacity="0.4"/>
  
  <!-- Text -->
  <text x="50" y="320" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    Hi, I'm Belekova
  </text>
  <text x="50" y="360" font-size="16" fill="#B19CD9" font-family="Arial, sans-serif">
    Sagittarius • Developer • Lifelong Learner
  </text>
</svg>